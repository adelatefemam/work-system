:root{--bg1:#0a0405;--bg2:#3d0b12;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.1);--tx:#f6eef0;--mut:#b9a6aa;--ac:#e0364b;--ok:#3fcf8e;--warn:#f2b84b;--bad:#ff5d6c;color-scheme:dark}
*{box-sizing:border-box}html{height:100%;background:#0a0405}body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 0% 0%,#0a0405,#3d0b12,#0a0405);pointer-events:none}
body{margin:0;min-height:100%;font-family:Almarai,"Segoe UI",Tahoma,system-ui,sans-serif;color:var(--tx);padding:calc(76px + env(safe-area-inset-top,0px)) 0 env(safe-area-inset-bottom,0)}
header{position:fixed;top:0;left:0;right:0;width:100%;z-index:20;height:calc(76px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,0px) 24px 0;border-radius:0;border-bottom:1px solid var(--line);background:radial-gradient(circle at 50% 0%,rgba(224,54,75,.22),transparent 60%),rgba(10,4,5,.82);backdrop-filter:blur(14px)}
#out{margin-inline-start:auto}
header img{position:absolute;left:50%;top:calc(50% + env(safe-area-inset-top,0px)/2);transform:translate(-50%,-50%);height:50px;max-width:46%;object-fit:contain}
.hb{height:44px;min-width:44px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;justify-content:center}
.hb:hover{background:rgba(255,255,255,.12)}
main{width:100%;max-width:none;margin:0;padding:20px 24px 60px}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:10px;margin-bottom:20px}
nav button{flex:none;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);font:inherit;cursor:pointer}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-bottom:16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(6,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.vh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:13px;margin:14px 0 10px}.vch{display:flex;align-items:flex-end;gap:4px;height:215px;min-width:100%;border-bottom:1px solid var(--line);padding-bottom:0}.vc{flex:1;min-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px}.vc span{font-size:11px;color:var(--mut);line-height:1.3;white-space:nowrap}.vc span.lb{max-width:100%;overflow:hidden;text-overflow:ellipsis;padding-bottom:4px}.vc i{display:block;width:70%;border-radius:6px 6px 2px 2px;background:#7D1727;border:1px solid rgba(255,255,255,.14);box-sizing:border-box}.vc i.pk{background:#7D1727;border-color:rgba(255,90,110,.75)}.vc i.z{background:rgba(255,255,255,.1);border:0}
.st{width:100%;min-width:640px;table-layout:fixed}.st th,.st td{overflow:hidden;text-overflow:ellipsis}.vch.cl .vc{min-width:64px}.sg{display:grid;gap:12px;grid-template-columns:1fr;margin-bottom:16px}@media(min-width:560px){.sg{grid-template-columns:repeat(2,1fr)}}@media(min-width:1100px){.sg{grid-template-columns:repeat(3,1fr)}}.sc{display:flex;align-items:center;gap:12px;padding:14px 16px;margin:0}.sc .ico{width:40px;height:40px;border-radius:50%;background:rgba(224,54,75,.18);display:flex;align-items:center;justify-content:center;flex:none}.sc .ico svg{width:22px;height:22px;stroke:#ff8a98;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sc .l{color:var(--mut);font-size:13px;line-height:1.4}.sc .n{font-size:24px;font-weight:700;line-height:1.3}.sc .n small{color:var(--mut);font-size:13px;font-weight:400;margin-inline-start:5px}.sc .n.m{display:flex;flex-wrap:wrap;gap:0 18px;align-items:baseline}.grid .card{margin:0}.k{color:var(--mut);font-size:13px}.v{font-size:26px;font-weight:700;margin-top:4px}
.grid .card .k{font-size:12.5px;line-height:1.55}
.grid .card .v{font-size:24px;line-height:1.35;font-weight:700}
.grid .card .v.ml{font-size:17px;margin-top:2px;line-height:1.7}.grid .card .v .u{font-size:14px;color:var(--mut);font-weight:700}
h2{font-size:17px;margin:0 0 12px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;white-space:nowrap}
th{color:#fff;font-weight:600;text-align:center;padding:10px 12px;background:#7d1727;border-bottom:1px solid rgba(255,255,255,.12);border-inline-end:1px solid rgba(255,255,255,.14)}td{text-align:center;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.07);border-inline-end:1px solid rgba(255,255,255,.07)}th:last-child,td:last-child{border-inline-end:0}.split{display:flex;align-items:flex-start}.split table{width:auto}.fzt{flex:none;border-inline-end:2px solid rgba(224,54,75,.55)}.scr{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}.split tr:hover td{background:transparent}.split tr.hv td{background:rgba(255,255,255,.04)}.split .fzt th:last-child,.split .fzt td:last-child{border-inline-end:0}@media(max-width:600px){.fzt th,.fzt td{padding-inline:8px;font-size:13px}}#warnfab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:54px;height:54px;border-radius:50%;border:0;background:var(--tx);color:var(--ac);font-size:26px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45);display:none;align-items:center;justify-content:center}#warnfab.on{display:flex}#warnfab .warnico{width:32px;height:32px;display:block;margin:0 auto}#warnfab{padding:0}#warncnt{position:absolute;top:-4px;left:-4px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:10px;background:var(--ac);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center}.wl{display:flex;flex-direction:column;gap:8px;margin:8px 0 14px}.wl button{text-align:start;white-space:normal}.wl small{display:block;color:var(--mut);margin-top:2px}
tr:hover td{background:rgba(255,255,255,.03)}
td:empty::before{content:"—";color:var(--mut);opacity:.75}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:rgba(255,255,255,.08)}
.tag.approval-check{background:transparent}
.t-ok{background:rgba(63,207,142,.15);color:var(--ok)}.t-warn{background:rgba(242,184,75,.15);color:var(--warn)}.t-bad{background:rgba(255,93,108,.15);color:var(--bad)}.t-vip{background:rgba(224,54,75,.25);color:#ff8a98}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}.bar b{flex:0 0 clamp(72px,28%,110px);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .bt{flex:1 1 0;min-width:0}.bar i{display:block;max-width:100%;height:12px;border-radius:99px;background:linear-gradient(90deg,var(--ac),#ff8a98)}.bar span{color:var(--mut);white-space:nowrap;flex:0 0 auto;min-width:48px;text-align:end}
.tb{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--tx);font:inherit}
.tb input{flex:1;min-width:160px}
.btn{padding:10px 16px;border-radius:12px;border:0;background:var(--ac);color:#fff;font:inherit;cursor:pointer}.btn.g{background:rgba(255,255,255,.08)}
.ic{background:none;border:0;color:var(--mut);cursor:pointer;font-size:15px}.ic:hover{color:#fff}.ic svg,.action-icon{width:16px;height:16px;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.date-control{display:flex;align-items:center;gap:6px;min-width:0;position:relative}.date-control>input[data-date-display]{flex:1;min-width:0}.date-picker-trigger{flex:0 0 auto;padding:8px 10px;white-space:nowrap}.date-picker-native{position:absolute;left:0;top:calc(100% + 2px);width:1px;height:1px;opacity:0;pointer-events:none}.date-range-field{flex:0 1 300px;min-width:190px;max-width:320px}
dialog{width:min(720px,94vw);max-height:90vh;border:1px solid var(--line);border-radius:20px;background:#140608;color:var(--tx);padding:20px}dialog::backdrop{background:#000a}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.f label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}.f .w{grid-column:1/-1}
.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.note{color:var(--mut);font-size:13px}.empty{padding:24px;text-align:center;color:var(--mut)}
a.plink{color:var(--tx);text-decoration:none;font-size:15px;margin-inline-end:4px}a.plink:hover{color:var(--ac)}
.shd{grid-column:1/-1;font-weight:700;font-size:14px;color:#ff8a98;border-bottom:1px dashed var(--line);padding-bottom:6px}
a.plink{display:inline-flex;vertical-align:middle}a.plink svg{width:21px;height:21px;border-radius:5px}
.pgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.pgrid>div{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px}.pv{font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.plan-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px;margin-top:10px}
.plan-card{position:relative;display:flex;flex-direction:column;min-width:0;overflow:hidden;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:15px}
.plan-card.featured{border:2px solid var(--ac)}
.plan-card .popular{position:absolute;top:0;left:14px;padding:5px 10px;border-radius:0 0 10px 10px;background:var(--ac);color:#fff;font-size:11px}
.plan-card-head{padding:17px 16px 13px;background:linear-gradient(135deg,rgba(224,54,75,.17),rgba(125,23,39,.3));border-bottom:1px solid var(--line)}
.plan-card-main{padding:14px 16px 16px;flex:1}
.plan-card-name{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:17px;font-weight:700}
.plan-card-price{margin-top:10px;font-size:25px;font-weight:700;line-height:1.4}
.plan-card-price small{font-size:12px;font-weight:400;color:var(--mut)}
.plan-card-details{margin:7px 0 0;padding-inline-start:20px;color:var(--mut);font-size:13px;line-height:1.8;overflow-wrap:anywhere;list-style:disc}
.plan-card-details li+li{margin-top:3px}.plan-card-details li::marker{color:var(--ac)}
.plan-details-input{min-height:190px;resize:vertical;line-height:1.8;white-space:pre-wrap}
.plan-card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);color:var(--mut);font-size:12px}
.plan-card-actions{display:flex;align-items:center;gap:5px}
.support-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:2px 0 14px}
.support-head h1{font-size:22px;margin:0 0 4px}
.support-head p{font-size:13px;color:var(--mut);margin:0}
.support-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.support-stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 14px;min-width:0}
.support-stat span{display:block;color:var(--mut);font-size:12px;margin-bottom:6px}
.support-stat strong{display:block;font-size:20px;line-height:1.4}
.support-stat small{display:block;color:var(--mut);font-size:11px;margin-top:4px}
@media(max-width:600px){.plan-cards{grid-template-columns:1fr}.plan-card-main{padding:14px}.plan-card-price{font-size:23px}}
@media(max-width:760px){.support-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.support-head{align-items:flex-start}.support-head h1{font-size:20px}}
@media(max-width:480px){.support-head{flex-direction:column}.support-summary{gap:8px}.support-stat{padding:10px}.support-stat strong{font-size:17px}}
body.locked{overflow:hidden}
#gate{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 0% 0%,#0a0405,#3d0b12,#0a0405);padding:20px;transition:opacity .45s}
#gate.off{opacity:0;pointer-events:none}#gate:not(.need) .gcard{visibility:hidden;animation:gshow 0s 8s forwards}@keyframes gshow{to{visibility:visible}}
.gcard{width:min(380px,92vw);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:22px;padding:30px 26px;text-align:center;box-shadow:0 30px 60px #000c}
.gcard img{height:60px;max-width:62%;object-fit:contain}
.gcard h1{font-size:19px;margin:8px 0 4px}
.gcard p{color:var(--mut);font-size:13px;margin:0 0 16px}
.gcard input{direction:ltr;text-align:center;letter-spacing:2px;width:100%;box-sizing:border-box;margin-top:10px}
.gcard input[type=email]{letter-spacing:normal}
.gerr{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.gcard.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(7px)}50%{transform:translateX(-7px)}75%{transform:translateX(4px)}}

/* ===== C2 cards ===== */
.kg{display:grid;gap:12px;grid-template-columns:repeat(4,1fr);margin-bottom:16px}
@media(max-width:1000px){.kg{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.kg{grid-template-columns:1fr}}
.kc{position:relative;overflow:hidden;min-width:0;border-radius:20px;padding:16px 18px;background:var(--card);border:1px solid var(--line);transition:transform .2s,border-color .2s}
.kc:hover{transform:translateY(-3px);border-color:rgba(224,54,75,.55)}
.kc svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kwide{grid-column:span 2}@media(max-width:560px){.kwide{grid-column:auto}}
.khero .kn{font-size:46px}
.kt{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;position:relative}
.kt .ico{width:34px;height:34px;border-radius:11px;background:rgba(224,54,75,.2);color:#ff8a98;display:flex;align-items:center;justify-content:center;flex:none}
.kt .ico svg{width:19px;height:19px}
.kn{font-size:34px;font-weight:700;line-height:1.1;margin-top:12px;position:relative}
.kn small{font-size:14px;color:var(--mut);font-weight:400;margin-inline-start:6px}
.ks{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;position:relative}
.kch{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--mut)}
.kch b{color:var(--tx);margin-inline-start:4px}
.kch.ok b{color:var(--ok)}.kch.bad b{color:var(--bad)}.kch.warn b{color:var(--warn)}
.kseg{display:flex;height:7px;border-radius:9px;overflow:hidden;gap:2px;margin-top:14px;background:rgba(255,255,255,.06);position:relative}
.kseg i{display:block;height:100%}
.kspark{display:block;width:100%;height:46px;margin-top:10px;color:#ff8a98;position:relative}
.kspark path{vector-effect:non-scaling-stroke;stroke-width:2}
.kspark .a{fill:rgba(255,138,152,.14);stroke:none}
.kpair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;position:relative}
.kpair div{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 12px}
.kpair b{display:block;font-size:20px}.kpair span{font-size:12px;color:var(--mut)}
</style>
</head>

  <p>ادخل البريد الإلكتروني وكلمة المرور الخاصة بحسابك</p>
  <input type="email" id="gem" placeholder="البريد الإلكتروني" autocomplete="username" autofocus>

function cell(t,k,r){

  if(t==="support"&&(k==="name"||k==="store")){const c=supportClient(r);if(c)return esc(k==="name"?c.name||c.id:c.brand||c.store_id)}
  if(k==="egp")return fmt(egp(r));
  if(k==="dstatus"){const ok=String(r.end??"").trim()!=="";return `<span class="tag ${ok?"t-ok":"t-warn"}">${ok?"مكتملة":"غير مكتملة"}</span>`}
  if(k==="status"){const s=status(r);return s?`<span class="tag ${s[0]==="✅"?"t-ok":s[0]==="⚠"?"t-warn":"t-bad"}">${s}</span>`:""}
  if(k==="fee")return t==="support"?money(r.feeSnapshot??r.fee,r.currencySnapshot||r.currency):fmt(r.feeSnapshot??r.fee);if(t==="support"&&k==="paid")return money(collectedAmount(r),r.currency)+(r.renewalReview?" ⚠":"");if(t==="support"&&k==="currency")return esc(currencyLabel(r.currency));if(t==="support"&&k==="pstatus"){const v=paymentStatusSummary(r),cls=v.startsWith("مدفوع بالكامل")?"t-ok":v.startsWith("مدفوع جزئيًا")?"t-warn":"t-bad";return `<span class="tag ${cls}">${esc(v)}</span>`}if(k==="sstatus"){const st=subStatus(r);return st[0]?`<span class="tag ${st[1]}">${st[0]}</span>`:"—"}if(k==="end"&&t==="support"){const e2=endOf(r);return esc(r.end)||(e2?fd(e2):"—")}
  if(k==="subMonths")return monthsSub(r);
  if(k==="stopMonths"){const n2=inaMonths(r);return n2?`<span class="tag t-warn">${n2} شهر</span>`:"0"}
  if(k==="links"){const h=["phone","whatsapp","website","instagram","tiktok","facebook"].map(pk=>{const v=String(r[pk]??"").trim();if(!v)return"";let u="",tg=' target="_blank" rel="noopener"';if(pk==="phone"){const d=v.replace(/[^\d+]/g,"");u=d?"tel:"+d:"";tg=""}else if(pk==="whatsapp"){const d=waNum(v,r.country);u=d?"https://wa.me/"+d:""}else u=/^https?:\/\//i.test(v)?v:/^[\w-]+(\.[\w-]+)+([\/?#]\S*)?$/i.test(v)?"https://"+v:"";return u?`<a class="plink" href="${esc(u)}"${tg} title="${esc(v)}">${ICONS[pk]}</a>`:""}).join("");return h||'<span class="note">—</span>'}
  const fd0=SC[t].f.find(x=>x[0]===k);if(fd0&&fd0[2]==="u")return r[k]?`<a href="${esc(r[k])}" target="_blank" rel="noopener" style="color:#ff8a98">↗ فتح</a>`:"";
  return esc(r[k]);
}

  Object.entries(SC).forEach(([t,c])=>{const rows=S[t].map(r=>Object.fromEntries(c.f.map(([k,l])=>[l,r[k]??""])));XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(rows,{header:c.f.map(x=>x[1])}),c.sheet)});
  XLSX.writeFile(w,"Work System.xlsx");
}
function exportHtml(){
 const a=A(),d=new Date(),ds=d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear();
 const cols=t=>[...SC[t].f.map(x=>x[0]),"total",...(t!=="support"?["egp","dstatus"]:[])];
 const val=(t,k,r)=>k==="total"?fmt(total(r)):k==="egp"?fmt(egp(r)):k==="dstatus"?(String(r.end??"").trim()?"مكتملة":"غير مكتملة"):(r[k]??"");
 const tbl=t=>{const ks=cols(t);return`<h2>${esc(nm(t))} (${S[t].length})</h2><div class="wrap"><table><tr>${ks.map(k=>`<th>${esc(lab(t,k))}</th>`).join("")}</tr>${S[t].map(r=>`<tr>${ks.map(k=>`<td>${esc(val(t,k,r))}</td>`).join("")}</tr>`).join("")}</table></div>`};
 const cards=[["إجمالي الدخل (ج.م)",fmt(a.e.all)],["المواقع المنفذة",S.clients.length],["مشاريع إضافية",S.projects.length],["اشتراكات الدعم",S.support.length],["المحصل من الدعم (ج.م)",fmt(a.sup)]];
 const h=`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(S.settings.title)} — نسخة ${ds}</title><style>body{margin:0;padding:24px;font-family:Almarai,"Segoe UI",Tahoma,system-ui,sans-serif;background:#0a0405;color:#f6eef0}h1{font-size:20px}h2{font-size:17px;margin:28px 0 10px}.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.c{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px}.c b{display:block;font-size:22px;margin-top:4px}.k{color:#b9a6aa;font-size:13px}.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th{color:#b9a6aa;text-align:start;padding:8px;border-bottom:1px solid rgba(255,255,255,.15)}td{padding:8px;border-bottom:1px solid rgba(255,255,255,.06)}</style></head><body><h1>${esc(S.settings.title)} — نسخة بتاريخ ${ds}</h1><div class="g">${cards.map(([k,v])=>`<div class="c"><span class="k">${k}</span><b>${v}</b></div>`).join("")}</div>${tbl("clients")}${tbl("projects")}${tbl("support")}</body></html>`;
 dl("index.html",new Blob([h],{type:"text/html"}));
}
function fd(v){if(v instanceof Date)return v.getDate()+"/"+(v.getMonth()+1)+"/"+v.getFullYear();return v==null||v==="-"?"":String(v)}
function importFile(f){
  const rd=new FileReader();
  if(/\.json$/i.test(f.name)){rd.onload=()=>{try{S={...SEED,...JSON.parse(rd.result)};fixS();save();render();alert("تم الاستيراد ✅")}catch(e){alert("ملف البيانات غير صالح")}};rd.readAsText(f);return}
  rd.onload=()=>{try{const w=XLSX.read(rd.result,{type:"array",cellDates:true});
    const LEG={clients:"Clients",projects:"Projects",support:"Support"};
    Object.entries(SC).forEach(([t,c])=>{const ws=w.Sheets[c.sheet]||w.Sheets[LEG[t]];if(!ws)return;
      const all=XLSX.utils.sheet_to_json(ws,{defval:"",blankrows:true}),rg=XLSX.utils.decode_range(ws["!ref"]),hd={};
      for(let cc=rg.s.c;cc<=rg.e.c;cc++){const h=ws[XLSX.utils.encode_cell({r:0,c:cc})];if(h)hd[h.v]=cc}
      const lk=(ri,l)=>{const x=ws[XLSX.utils.encode_cell({r:ri+1,c:hd[l]})];return x&&x.l&&x.l.Target?x.l.Target:""};
      const rows=all.map((r,i)=>[r,i]).filter(([r])=>r[c.f[0][1]]);
      if(!rows.length&&t==="support")return;
      S[t]=rows.map(([r,i])=>Object.fromEntries(c.f.map(([k,l,ty])=>[k,ty==="n"?num(r[l]):ty==="u"?(lk(i,l)||(/^https?:/i.test(r[l])?r[l]:"")):fd(r[l])])))});
    fixS();save();render();alert("تم الاستيراد ✅")}catch(e){alert("تعذر قراءة الملف")}};
  rd.readAsArrayBuffer(f);
}
/* ---------- الأحداث ---------- */
const $=s=>document.querySelector(s),$logo=$("#logo"),DEF_LOGO=$logo.src,$nav=$("#nav"),$view=$("#view"),$dlg=$("#dlg"),$frm=$("#frm"),$file=$("#file");
new MutationObserver(()=>enhanceDatePickers($frm)).observe($frm,{childList:true,subtree:true});
document.addEventListener("click",e=>{
  const t=e.target.closest?.("button")||e.target;
  if(t.dataset.rp){const n=new Date(),iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),k=t.dataset.rp;if(k==="all"){rf="";rt=""}else{rt=iso(n);rf=k==="m"?iso(new Date(n.getFullYear(),n.getMonth(),1)):k==="3"?iso(new Date(n.getFullYear(),n.getMonth()-2,1)):iso(new Date(n.getFullYear(),0,1))}render()}
  else if(t.dataset.t){tab=t.dataset.t;q="";render()}
  else if(t.dataset.add)openForm(t.dataset.add);
  else if(t.dataset.prof){const[a,b]=t.dataset.prof.split(":");a==="clients"?openClientProfile(+b):openProfile(+b)}
  else if(t.dataset.renewConfirm){const[a,b]=t.dataset.renewConfirm.split(":");confirmRenewal(+a,+b)}
  else if(t.dataset.renew)openRenew(+t.dataset.renew);
  else if(t.dataset.stop)toggleStop(+t.dataset.stop);
  else if(t.dataset.resume){toggleStop(+t.dataset.resume,true)}
  else if(t.dataset.addplan)openPlanForm();
  else if(t.dataset.plan)openPlanForm(+t.dataset.plan);
  else if(t.dataset.dplan){const j=+t.dataset.dplan;if(confirm("حذف الباقة دي؟")){S.settings.plans.splice(j,1);save();render()}}
  else if(t.dataset.edit){const[a,b]=t.dataset.edit.split(":");openForm(a,+b)}
  else if(t.dataset.del){const[a,b]=t.dataset.del.split(":");if(confirm("حذف السجل ده؟")){S[a].splice(+b,1);save();render()}}
  else if(t.dataset.m){const m=t.dataset.m;
    if(m==="xl")exportXlsx();else if(m==="html")exportHtml();else if(m==="js")dl("Work System.json",new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));
    else if(m==="im")$file.click();else if(m==="logo")$("#logof").click();else if(m==="logo0"){S.settings.logo="";save();theme()}else if(m==="cl"){if(confirm("هيتم مسح كل العملاء والمشاريع والاشتراكات. متأكد؟")){S.clients=[];S.projects=[];S.support=[];save();render()}}
    else if(m==="rs"&&confirm("هيتم مسح بياناتك الحالية والرجوع للبيانات الأصلية. متأكد؟")){S=JSON.parse(JSON.stringify(SEED));save();render()}}
});
$file.onchange=()=>{if($file.files[0])importFile($file.files[0]);$file.value=""};
document.addEventListener("input",e=>{
  if(e.target.id==="q"){q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)}
  else if(e.target.dataset.set){S.settings[e.target.dataset.set]=e.target.type==="number"?num(e.target.value):e.target.value;save();theme()}
  else if(e.target.dataset.list){S.settings.lists[e.target.dataset.list]=e.target.value.split("\n").map(x=>x.trim()).filter(Boolean);save()}
  else if(e.target.dataset.name){S.settings.names[e.target.dataset.name]=e.target.value.trim();save();renderNav()}
  else if(e.target.dataset.pre){S.settings.pre[e.target.dataset.pre]=e.target.value;save()}
});
document.addEventListener("change",e=>{if(!e.target.dataset.rng)return;if(e.target.dataset.rng==="f")rf=datePickerValue(e.target.value);else rt=datePickerValue(e.target.value);render()});
$("#logof").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,600/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.settings.logo=c.toDataURL("image/png");save();theme()};im.src=URL.createObjectURL(f);e.target.value=""};
/* ---------- بوابة تسجيل الدخول — Supabase Auth (إيميل + كلمة مرور لكل مستخدم) ---------- */
const $gate=$("#gate"),$gem=$("#gem"),$gpw=$("#gpw"),$gerr=$("#gerr"),$out=$("#out");
$("#glogo").src=DEF_LOGO;
function gateFail(msg){
  $gerr.textContent=msg;
  const gc=$gate.querySelector(".gcard");gc.classList.remove("shake");void gc.offsetWidth;gc.classList.add("shake");
}
function unlock(email){
  try{localStorage.setItem("wk_last",JSON.stringify({id:cloudUid,email}))}catch(e){}
  $gate.classList.add("off");document.body.classList.remove("locked");
  setTimeout(()=>$gate.remove(),450);
  if($out){$out.hidden=false;$out.title="تسجيل الخروج ("+email+")"}
  init();
}
async function tryUnlock(){
  if(!sb){gateFail("تعذر تسجيل الدخول الآن — تأكد من الاتصال بالإنترنت ثم أعد المحاولة");return}
  const em=$gem.value.trim(),pw=$gpw.value;
  if(!em||!pw){gateFail("ادخل البريد الإلكتروني وكلمة المرور");return}
  const $btn=$("#gform .btn");$btn.disabled=true;$gerr.textContent="جارٍ التحقق…";
  try{
    const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
    if(error){
      gateFail(error.message==="Invalid login credentials"?"بيانات الدخول غير صحيحة — تأكد من الإيميل وكلمة المرور":error.message==="Email not confirmed"?"البريد غير مؤكد — فعّل الحساب من Supabase → Authentication → Users":"تعذر تسجيل الدخول: "+error.message);
      $gpw.value="";
      return;
    }
    cloudUid=(data.user&&data.user.id)||null;cloudEmail=(data.user&&data.user.email)||em;unlock(cloudEmail);
  }catch(e){gateFail("تعذر الوصول إلى Supabase — تحقق من الاتصال وصحة SUPABASE_URL")}
  finally{$btn.disabled=false}
}
$("#gform").onsubmit=e=>{e.preventDefault();tryUnlock()};
if($out)$out.onclick=async()=>{try{localStorage.removeItem("wk_last")}catch(e){}try{if(sb)await sb.auth.signOut({scope:"local"})}catch(e){}location.reload()};
/* عند الفتح: جلسة محفوظة؟ فتح تلقائي — وإلا بطاقة الدخول */
(async()=>{
  const cached=()=>{try{const lu=JSON.parse(localStorage.getItem("wk_last")||"null");if(lu&&lu.id){cloudUid=lu.id;cloudEmail=lu.email||"";unlock(cloudEmail);return true}}catch(e){}return false};
  if(sb){
    try{
      const{data,error}=await sb.auth.getSession();
      if(data&&data.session&&data.session.user){cloudUid=data.session.user.id;cloudEmail=(data.session.user&&data.session.user.email)||"";unlock(cloudEmail);return}
      if(error&&cached())return;
    }catch(e){if(cached())return;$gerr.textContent="تعذر الوصول إلى Supabase — تحقق من الاتصال وصحة SUPABASE_URL"}
  }
  $gate.classList.add("need");$gpw.focus();
})();

</script>
