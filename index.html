:root{box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0a0405;--card:rgba(10,4,5,.55);--tx:#f3e9ea;--mu:#b39a9d;--bd:rgba(255,255,255,.12);--ac:#ff5a6e;--acb:#9b1c2e;--acs:rgba(255,90,110,.16);--wn:#ffb36b;--wns:rgba(255,179,107,.16)}
html{font-size:17px;scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:#0a0405}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 0% 0%,#0a0405,#3d0b12,#0a0405) fixed;color:var(--tx);font-family:"Almarai","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.6}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:center;align-items:center;padding:12px 16px;background:linear-gradient(90deg,#0b0506,#150709 60%,#1d0a0d);border-bottom:1px solid var(--bd)}
.logo{display:block;height:44px;max-width:60%;margin:0}
.w{width:100%;max-width:none;padding:16px 24px}
.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button,.b{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 16px;border-radius:8px;cursor:pointer}
.tabs button.on,.b.p{background:var(--acb);color:#fff;border-color:var(--ac)}
.card{backdrop-filter:blur(6px);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;min-width:0}
select option{background:#1a0a0d;color:var(--tx)}
input[type=number]{width:90px}
input[type=checkbox]{accent-color:#ff5a6e}
input[type=date]{color-scheme:dark}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:8px;margin-top:10px}
.mu{color:var(--mu);font-size:15px}
.bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.pr{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.pct{font-size:22px;color:var(--ac);font-weight:700}
.bar{height:8px}
.nx{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.today{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:12px}
.today>.card{flex:0 0 calc((100% - 36px)/4);min-width:0;margin-bottom:0}
@media(max-width:1100px){.today>.card{flex-basis:calc((100% - 12px)/2)}}
@media(max-width:600px){.today>.card{flex-basis:100%}}
.day{border:1px solid var(--bd);border-radius:10px;padding:10px;background:rgba(255,255,255,.03)}
.day.cur{border-color:var(--ac)}
.day h4{margin:0 0 6px;font-size:16px}
.t{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.t input{margin-top:6px;flex:none}
.t.done span{text-decoration:line-through;color:var(--mu)}
.t .ck{flex:none;width:16px;color:#3ddc84;font-weight:700;margin-top:1px}
.t span{flex:1}
.x{border:0;background:none;color:var(--mu);cursor:pointer;font-size:20px}
.tag{font-size:14px;padding:1px 8px;border-radius:10px;background:var(--acs);color:var(--ac);white-space:nowrap}
.tag.l{background:var(--wns);color:var(--wn)}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.hd strong{font-size:18px}
.add{margin-top:8px}.add input{flex:1}
#lock{display:none}
body.locked .top,body.locked .w{display:none}
body.locked #lock{display:flex;height:100vh;height:100dvh;align-items:center;justify-content:center;padding:12px;overflow:hidden}
html:has(body.locked),body.locked{overflow:hidden}
.lc{width:min(380px,100%);padding:32px 26px;border-radius:22px;border:1px solid rgba(255,255,255,.14);background:linear-gradient(135deg,rgba(90,22,32,.7),rgba(18,7,9,.88));text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lc img{display:block;height:58px;max-width:100%;margin:0 auto 15px}
.lc h2{margin:0 0 2px;font-size:18px}
.lc p{margin:0 0 24px;color:var(--mu);font-size:13px}
.lc input{width:100%;padding:9px 16px;border-radius:14px;text-align:center;font-size:15px;margin-bottom:10px;background:rgba(0,0,0,.35)}
.lc button{width:100%;padding:9px 12px;border:0;border-radius:14px;background:#e0374d;color:#fff;font:inherit;font-size:15px;cursor:pointer}
#pe{color:#ff8a98;font-size:14.5px;min-height:18px;margin-top:8px;line-height:18px}
html,body{overflow-x:hidden}
@media(max-width:600px){
.w{padding:12px}
.card{padding:12px}
.tabs button,.b{padding:6px 12px;font-size:15px}
.logo{height:36px}
}
.tag.g{background:rgba(61,220,132,.16);color:#3ddc84}
.tag.r{background:rgba(255,90,110,.22);color:#ff8a98}
.tag.n{background:var(--bd);color:var(--mu)}
.bar.g i{background:#3ddc84}
.bar.t i{background:var(--wn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px;margin-bottom:12px}
.kpi{backdrop-filter:blur(6px);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:26px;color:var(--ac);line-height:1.4}
.kpi span{color:var(--mu);font-size:14px}
.tw{overflow-x:auto;margin-top:8px}
.st{width:100%;min-width:680px;border-collapse:collapse;font-size:15px}
.st th,.st td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--bd);white-space:nowrap}
.st th{color:var(--mu);font-weight:400;font-size:14px}
.st tr:last-child td{border-bottom:0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(120px,100%),1fr));gap:8px;margin:10px 0}
.kv div{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
.kv b{display:block;font-size:16px}
.kv span{color:var(--mu);font-size:13px}
.ds{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dc{font-size:13px;padding:2px 8px;border-radius:8px;border:1px solid var(--bd);color:var(--mu)}
.dc.ok{border-color:#3ddc84;color:#3ddc84}
.dc.bad{border-color:var(--ac);color:var(--ac)}
.dc.mid{border-color:var(--wn);color:var(--wn)}
.dc.cur{box-shadow:0 0 0 1px var(--tx)}
body{text-align:center}
.top{position:sticky}
.lo{position:absolute;left:16px;top:50%;transform:translateY(-50%)}
.row,.hd,.pr,.nx,.ds,.t{justify-content:center}
.pr{gap:14px;flex-wrap:wrap}
.hd{text-align:center}
.t span{text-align:center}
input,select{text-align:center;text-align-last:center}
.st th,.st td{text-align:center}
.kpi,.kv div{text-align:center}
@media(max-width:600px){.lo{left:10px;padding:6px 12px}}
.t{justify-content:flex-start}
.t span{text-align:right}
.add{justify-content:flex-start}
.add input{text-align:right;text-align-last:right}
em,i,cite{font-style:normal}
.tag{display:inline-block;text-decoration:none}
.cg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.cg>.card{margin-bottom:0}
.cg>.card.wide{grid-column:1/-1}
.bar{height:6px}
@media(max-width:1100px){.cg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.cg{grid-template-columns:1fr}}
</style>
</head>

<script>
// ===== الصق بيانات مشروع خطة الشغل هنا (Project Settings > API) =====
var SB_URL='https://kdjpayloixkmlakvizir.supabase.co';
var SB_KEY='sb_publishable_3vccQC8IaOcXnbxYbQJgIQ_SBqZMsjb'; // publishable فقط، ممنوع secret / service_role
// ====================================================================
var sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.localStorage}});
var SV=['بناء كامل من الصفر','إعادة تصميم','تطوير'];
var S={clients:[],tab:'today',open:{},focus:null,msg:''};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function wk(d){return d.getDay()==5}
function dayNo(c){var t=new Date();t.setHours(0,0,0,0);var d=new Date(c.start+'T00:00:00'),n=0;while(d<=t){if(!wk(d))n++;d.setDate(d.getDate()+1)}return n}
function dateOf(c,k){var d=new Date(c.start+'T00:00:00'),n=0;while(true){if(!wk(d)){n++;if(n==k)return d}d.setDate(d.getDate()+1)}}
var DN=['الأحد','الاتنين','التلات','الأربع','الخميس','الجمعة','السبت'],MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function fmt(d){return DN[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()]}
function cl(id){return S.clients.find(function(x){return x.id==id})}
function go(t){S.tab=t;render()}
function todayISO(){return iso(new Date())}

function effDay(c){var cur=dayNo(c),a=c.ahead||0;return Math.min(Math.max(cur,a),Math.max(c.days,cur))}
function nextDay(cid){var c=cl(cid),e=effDay(c);if(e<c.days){c.ahead=e+1;render();w(sb.from('planner_clients').update({ahead_to:c.ahead}).eq('id',cid))}}
function backDay(cid){var c=cl(cid),e=effDay(c),cur=dayNo(c);if(e>cur){c.ahead=e-1;render();w(sb.from('planner_clients').update({ahead_to:c.ahead}).eq('id',cid))}}
function pbar(c){var n=c.tasks.filter(function(t){return t.done}).length,p=prog(c);return '<div class="pr"><span class="mu">خلصت '+n+' من '+c.tasks.length+' مهمة</span><b class="pct"><bdi>'+p+'%</bdi></b></div><div class="bar"><i style="width:'+p+'%"></i></div>'}

// ---------- قاعدة البيانات ----------
function w(p){p.then(function(r){if(r.error){S.msg='مقدرتش أحفظ: '+r.error.message;load()}})}
async function load(){
  var a=await sb.from('planner_clients').select('*').order('created_at');
  var b=await sb.from('planner_tasks').select('*').order('created_at');
  if(a.error||b.error){S.msg='معرفتش أحمل البيانات: '+(a.error||b.error).message;render();return}
  S.ok=true;
  S.clients=a.data.map(function(c){
    return{id:c.id,name:c.name,store:c.store,svc:c.svc,days:c.days,start:c.start_date,deliv:c.delivered_at||null,ahead:c.ahead_to||0,
      tasks:b.data.filter(function(t){return t.client_id==c.id}).map(function(t){return{id:t.id,t:t.t,d:t.d,done:t.done,doneOn:t.completed_on||null}})};
  });
  render();
}
function addClient(){
  var g=function(i){return document.getElementById(i).value.trim()};
  var n=g('cn'),st=g('cst'),sv=g('csv'),d=parseInt(g('cd'),10),s=g('cs');
  if(!n||!st||!sv||!d||d<1||!s){S.msg='كمل كل بيانات العميل.';render();return}
  var c={id:crypto.randomUUID(),name:n,store:st,svc:sv,days:d,start:s,tasks:[]};
  S.clients.push(c);S.open[c.id]=true;S.tab='clients';S.msg='';render();
  w(sb.from('planner_clients').insert({id:c.id,name:n,store:st,svc:sv,days:d,start_date:s}));
}
function tog(cid,tid){
  var t=cl(cid).tasks.find(function(x){return x.id==tid});t.done=!t.done;t.doneOn=t.done?todayISO():null;render();
  w(sb.from('planner_tasks').update({done:t.done,completed_on:t.doneOn}).eq('id',tid));
}
function delTask(cid,tid){
  var c=cl(cid);c.tasks=c.tasks.filter(function(x){return x.id!=tid});render();
  w(sb.from('planner_tasks').delete().eq('id',tid));
}
function delClient(cid){
  if(!confirm('متأكد إنك عايز تمسح العميل نهائي؟'))return;
  S.clients=S.clients.filter(function(x){return x.id!=cid});render();
  w(sb.from('planner_clients').delete().eq('id',cid));
}
function setDays(cid){
  var c=cl(cid),n=parseInt(document.getElementById('nd'+cid).value,10);if(!n||n<1)return;
  c.days=n;c.tasks.forEach(function(t){if(t.d>n)t.d=n});render();
  w(sb.from('planner_clients').update({days:n}).eq('id',cid));
  w(sb.from('planner_tasks').update({d:n}).eq('client_id',cid).gt('d',n));
}
function addTask(cid,d){
  var id='in'+cid+'_'+d,el=document.getElementById(id),t=el.value.trim();if(!t)return;
  var task={id:crypto.randomUUID(),t:t,d:d,done:false};
  cl(cid).tasks.push(task);S.focus=id;render();
  w(sb.from('planner_tasks').insert({id:task.id,client_id:cid,t:t,d:d}));
}
function kd(e,cid,d){if(e.key==='Enter')addTask(cid,d)}
function toggleOpen(cid){S.open[cid]=!S.open[cid];render()}

// ---------- التسليم ----------
function delivDate(c){return c.deliv||null}
function isDel(c){return!!delivDate(c)}
function toggleDel(cid){
  var c=cl(cid),val=isDel(c)?null:todayISO();
  c.deliv=val;render();
  w(sb.from('planner_clients').update({delivered_at:val}).eq('id',cid));
}
// ---------- العرض ----------
function taskRow(c,t,late,early){
  return '<div class="t'+(t.done?' done':'')+'"><input type="checkbox" '+(t.done?'checked ':'')+'onchange="tog(\''+c.id+'\',\''+t.id+'\')">'+(t.done?'<b class="ck">✔</b>':'')+'<span>'+esc(t.t)+(late?' <em class="tag l">متأخر · يوم '+t.d+'</em>':'')+(early?' <em class="tag">بدري · يوم '+t.d+'</em>':'')+'</span><button class="x" title="مسح" onclick="delTask(\''+c.id+'\',\''+t.id+'\')">×</button></div>';
}
function addRow(c,d){
  return '<div class="row add"><input id="in'+c.id+'_'+d+'" placeholder="ضيف مهمة واضغط Enter" onkeydown="kd(event,\''+c.id+'\','+d+')"><button class="b" onclick="addTask(\''+c.id+'\','+d+')">+</button></div>';
}
function prog(c){var n=c.tasks.filter(function(t){return t.done}).length;return c.tasks.length?Math.round(n*100/c.tasks.length):0}
function title(c){return '<strong>'+esc(c.name)+'</strong> <span class="mu">· '+esc(c.store)+'</span> <span class="tag">'+esc(c.svc)+'</span>'}
function renderToday(){
  if(!S.clients.length)return '<div class="card mu">ضيف أول عميل من تبويب العملاء.</div>';
  var live=S.clients.filter(function(c){return!isDel(c)});
  if(!live.length)return '<div class="card mu">مفيش شغل شغال دلوقتي، كل العملاء اتسلموا.</div>';
  return '<div class="grid today">'+live.map(function(c){
    var cur=dayNo(c);
    if(cur<1)return '<div class="card"><div>'+title(c)+'</div><div class="mu">هيبدأ '+fmt(new Date(c.start+'T00:00:00'))+'</div></div>';
    var eff=effDay(c),td=todayISO();
    var list=c.tasks.filter(function(t){
      if(t.d>eff)return false;
      if(!t.done)return true;
      return t.doneOn?t.doneOn==td:(t.d>=cur&&t.d<=eff);
    }).sort(function(a,b){return (a.done-b.done)||(a.d-b.d)});
    var openLeft=list.filter(function(t){return!t.done}).length;
    var over=cur>c.days?' <span class="tag l">عدى الميعاد اللي اتفقتوا عليه</span>':'';
    var ahead=eff>cur?' <span class="tag">شغال على يوم '+eff+' · بدري بـ '+(eff-cur)+' يوم</span>':'';
    var h='<div class="card"><div class="hd"><div>'+title(c)+'</div></div><div class="mu">يوم '+Math.min(cur,c.days)+' من '+c.days+over+ahead+'</div>'+pbar(c);
    h+=list.length?list.map(function(t){return taskRow(c,t,t.d<cur,t.d>cur)}).join(''):'<div class="mu">مفيش مهام لليوم ده.</div>';
    if(cur<=c.days)h+=addRow(c,Math.min(eff,c.days));
    if(cur<=c.days){
      h+='<div class="nx">';
      if(eff<c.days)h+='<button class="b'+(openLeft===0?' p':'')+'" onclick="nextDay(\''+c.id+'\')">▶ ابدأ شغل يوم '+(eff+1)+'</button>';
      if(eff>cur)h+='<button class="b" onclick="backDay(\''+c.id+'\')">↩ اخفي يوم '+eff+'</button>';
      h+='</div>';
    }
    return h+'</div>';
  }).join('')+'</div>';
}
function renderClients(){
  var form='<div class="card"><strong>عميل جديد (بعد ما يوافق على الـ Proposal)</strong><div class="frm">'+
    '<input id="cn" placeholder="اسم العميل"><input id="cst" placeholder="اسم المتجر">'+
    '<select id="csv">'+SV.map(function(v){return '<option>'+v+'</option>'}).join('')+'</select>'+
    '<input id="cd" type="number" min="1" placeholder="عدد الأيام" style="width:auto"><input id="cs" type="date" value="'+iso(new Date())+'">'+
    '<button class="b p" onclick="addClient()">اعمل الخطة</button></div><div class="mu" style="margin-top:6px">الجمعة أجازة. بعد ما تعمل الخطة اكتب مهام كل يوم بنفسك.</div></div>';
  return form+backup()+'<div class="cg">'+S.clients.map(function(c){
    var p=prog(c),cur=dayNo(c),open=S.open[c.id],dd=delivDate(c);
    var h='<div class="card'+(open?' wide':'')+'"><div class="hd"><div>'+title(c)+'</div><span class="mu">التسليم: '+fmt(dateOf(c,c.days))+' · '+c.days+' يوم</span>'+(dd?' <span class="tag g">اتسلم '+fmt(new Date(dd+'T00:00:00'))+'</span>':'')+'</div>'+pbar(c)+
      '<div class="row"><button class="b" onclick="toggleOpen(\''+c.id+'\')">'+(open?'اخفي الأيام':'اعرض الأيام')+'</button>'+
      '<span class="mu">عدد الأيام:</span><input id="nd'+c.id+'" type="number" min="1" value="'+c.days+'"><button class="b" onclick="setDays(\''+c.id+'\')">تعديل</button>'+
      '<button class="b'+(dd?' p':'')+'" onclick="toggleDel(\''+c.id+'\')">'+(dd?'✔ تم تسليم المتجر':'تسليم المتجر')+'</button>'+'<button class="b" onclick="delClient(\''+c.id+'\')">مسح العميل</button></div>';
    if(open){
      h+='<div class="grid" style="margin-top:12px">';
      for(var d=1;d<=c.days;d++){
        var ts=c.tasks.filter(function(t){return t.d==d});
        h+='<div class="day'+(d==cur?' cur':'')+'"><h4>يوم '+d+' · '+fmt(dateOf(c,d))+(d==cur?' <span class="tag">النهاردة</span>':'')+'</h4>'+ts.map(function(t){return taskRow(c,t,false)}).join('')+addRow(c,d)+'</div>';
      }
      h+='</div>';
    }
    return h+'</div>';
  }).join('')+'</div>';
}
function backup(){
  return '<div class="card"><div class="row"><strong>نسخة احتياطية</strong><button class="b" onclick="exp()">نزل نسخة (index.html)</button><label class="b">ارفع نسخة (HTML)<input type="file" accept=".html,.htm,text/html" style="display:none" onchange="impFile(this)"></label></div></div>';
}
function exp(){
  var data=JSON.stringify({v:2,clients:S.clients}).replace(/</g,'\\u003c');
  var body=S.clients.map(function(c){
    var n=c.tasks.filter(function(t){return t.done}).length,p=c.tasks.length?Math.round(n*100/c.tasks.length):0;
    var days={};c.tasks.forEach(function(t){(days[t.d]=days[t.d]||[]).push(t)});
    var rows=Object.keys(days).sort(function(a,b){return a-b}).map(function(d){
      return '<h4>يوم '+d+'</h4><ul>'+days[d].map(function(t){return '<li>'+(t.done?'✔ ':'◻ ')+esc(t.t)+'</li>'}).join('')+'</ul>';
    }).join('');
    return '<section><h2>'+esc(c.name)+' · '+esc(c.store)+'</h2><p>'+esc(c.svc)+' · '+c.days+' يوم · بدأ '+esc(c.start)+' · خلصت '+p+'%</p>'+rows+'</section>';
  }).join('');
  var html='<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>نسخة احتياطية - خطة الشغل - '+iso(new Date())+'</title><style>@import url(https://fonts.googleapis.com/css2?family=Almarai&display=swap);body{font-family:Almarai,Tahoma,Arial,sans-serif;max-width:800px;margin:24px auto;padding:0 16px;line-height:1.8}section{border:1px solid #ccc;border-radius:10px;padding:12px 16px;margin:12px 0}h4{margin:8px 0 0}ul{margin:4px 0;list-style:none;padding:0}</style></head><body><h1>نسخة احتياطية - خطة الشغل</h1><p>'+iso(new Date())+'</p>'+body+'<script type="application/json" id="aae-backup">'+data+'<\/script></body></html>';
  try{var b=new Blob([html],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='index.html';document.body.appendChild(a);a.click();a.remove()}catch(e){}
}
async function impFile(inp){
  var f=inp.files[0];if(!f)return;
  try{
    var txt=await f.text(),o;
    if(txt.indexOf('id="aae-backup"')>-1){var el=new DOMParser().parseFromString(txt,'text/html').getElementById('aae-backup');if(!el)throw new Error('bad');o=JSON.parse(el.textContent)}else o=JSON.parse(txt);
    var arr=Array.isArray(o)?o:o.clients;
    if(!Array.isArray(arr))throw new Error('bad');
    var cs=[],ts=[];
    arr.forEach(function(c){
      if(!c||!c.name||!c.days||!c.start)throw new Error('bad');
      var id=crypto.randomUUID();
      cs.push({id:id,name:c.name,store:c.store||'',svc:c.svc||'',days:c.days,start_date:c.start});
      (c.tasks||[]).forEach(function(t){ts.push({id:crypto.randomUUID(),client_id:id,t:t.t,d:t.d,done:!!t.done})});
    });
    var r1=await sb.from('planner_clients').insert(cs);if(r1.error)throw r1.error;
    if(ts.length){var r2=await sb.from('planner_tasks').insert(ts);if(r2.error)throw r2.error}
    S.msg='اتضاف '+cs.length+' عميل.';await load();
  }catch(e){S.msg='الملف مش سليم أو الرفع فشل.';render()}
  inp.value='';
}
// ---------- الإحصائيات ----------
function stat(c){
  var now=new Date();now.setHours(0,0,0,0);
  var tot=c.tasks.length,dn=c.tasks.filter(function(t){return t.done}).length,open=tot-dn;
  var cur=dayNo(c),shown=Math.min(Math.max(cur,0),c.days);
  var lateT=c.tasks.filter(function(t){return!t.done&&t.d<cur}).length;
  var todayT=cur>=1&&cur<=c.days?c.tasks.filter(function(t){return!t.done&&t.d==cur}).length:0;
  var ahead=c.tasks.filter(function(t){return t.done&&t.d>cur}).length;
  var start=new Date(c.start+'T00:00:00'),delivery=dateOf(c,c.days);
  var dd=delivDate(c);
  var o={dl:!!dd,dd:dd,c:c,tot:tot,dn:dn,open:open,cur:cur,lateT:lateT,todayT:todayT,ahead:ahead,
    pct:tot?Math.round(dn*100/tot):0,timePct:Math.min(100,Math.round(shown*100/c.days)),
    start:start,delivery:delivery,calLeft:Math.round((delivery-now)/864e5),rem:Math.max(0,c.days-cur),
    fin:tot>0&&open==0,k:'g',s:'',m:'',f:''};
  if(dd){
    var dv=new Date(dd+'T00:00:00'),dq=Math.round((delivery-dv)/864e5);
    o.k=dq>=0?'g':'r';o.s=dq>0?'اتسلم قبل الميعاد':dq==0?'اتسلم في الميعاد':'اتسلم بعد الميعاد';
    o.m='اتسلم '+fmt(dv)+(dq>0?' · قبل الميعاد بـ '+dq+' يوم':dq<0?' · بعد الميعاد بـ '+(-dq)+' يوم':'');
  }
  else if(cur<1){o.k='n';o.s='لسه ما بدأش';o.m='هيبدأ '+fmt(start)}
  else if(!tot){o.k='w';o.s='مفيش مهام متسجلة';o.m='ضيف مهام عشان الإحصائيات تبقى دقيقة'}
  else if(!open){
    var ds=c.tasks.map(function(t){return t.doneOn}),fd=ds.every(Boolean)?ds.sort().pop():null;
    if(fd){
      var df=Math.round((delivery-new Date(fd+'T00:00:00'))/864e5);
      o.k=df>=0?'g':'r';o.s=df>0?'خلص قبل الميعاد':df==0?'خلص في الميعاد':'خلص بعد الميعاد';
      o.m='آخر مهمة اتنفذت '+fmt(new Date(fd+'T00:00:00'))+(df>0?' · قبل التسليم بـ '+df+' يوم':df<0?' · بعد التسليم بـ '+(-df)+' يوم':'');
    }else if(o.calLeft>=0){
      o.s=o.calLeft>0?'خلص قبل الميعاد':'خلص في الميعاد';o.m='كل المهام المسجلة خلصت'+(o.calLeft>0?' · فاضل '+o.calLeft+' يوم على التسليم':'');
    }else{o.s='كل المهام خلصت';o.m='تاريخ الإنهاء مش مسجل'}
  }
  else if(o.calLeft<0){o.k='r';o.s='عدى ميعاد التسليم';o.m='متأخر '+(-o.calLeft)+' يوم · فاضل '+open+' مهمة'}
  else if(lateT>0){o.k=o.calLeft<=1?'r':'w';o.s='متأخر عن الجدول';o.m=lateT+' مهمة كان لازم تخلص قبل النهاردة'}
  else{o.s=ahead>0?'أسرع من الخطة':'على الجدول';o.m=ahead>0?'خلصت '+ahead+' مهمة من أيام لسه جاية'+(todayT?' · وفاضل '+todayT+' النهاردة':''):(todayT?'فاضل '+todayT+' مهمة النهاردة':'مفيش مهام متأخرة')}
  if(!dd&&open&&cur>=1&&o.calLeft>=0&&dn>0){
    var rate=dn/cur,need=Math.ceil(open/rate),have=c.days-cur+(wk(now)?0:1);
    o.f='تقدير: بمعدلك دلوقتي ('+rate.toFixed(1)+' مهمة في اليوم) باقي المهام محتاجة حوالي '+need+' يوم شغل، وفاضلك '+have+' يوم'+(need<=have?' — يعني هتخلص قبل الميعاد.':' — يعني ممكن تتأخر عن الميعاد.');
  }
  return o;
}
function kl(k){return k=='g'?'g':k=='w'?'l':k=='r'?'r':'n'}
function remTxt(o){
  if(o.fin||o.dl)return '—';
  if(o.cur<1)return 'هيبدأ '+fmt(o.start);
  if(o.calLeft<0)return 'متأخر <bdi>'+(-o.calLeft)+'</bdi> يوم';
  if(o.calLeft==0)return 'النهاردة';
  return '<bdi>'+o.calLeft+'</bdi> يوم ('+o.rem+' شغل)';
}
function dayStrip(c,cur){
  var h='<div class="ds">';
  for(var d=1;d<=c.days;d++){
    var ts=c.tasks.filter(function(t){return t.d==d}),k=ts.filter(function(t){return t.done}).length,cl2='';
    if(ts.length){if(k==ts.length)cl2='ok';else if(d<cur)cl2='bad';else if(d==cur)cl2='mid'}
    h+='<span class="dc '+cl2+(d==cur?' cur':'')+'" title="'+fmt(dateOf(c,d))+'">يوم '+d+': <bdi>'+(ts.length?k+'/'+ts.length:'—')+'</bdi></span>';
  }
  return h+'</div>';
}
function renderStats(){
  if(!S.clients.length)return '<div class="card mu">ضيف أول عميل من تبويب العملاء عشان الإحصائيات تظهر.</div>';
  var L=S.clients.map(stat).sort(function(a,b){return(a.dl-b.dl)||(a.fin-b.fin)||(a.calLeft-b.calLeft)});
  var act=L.filter(function(o){return!o.dl});
  var sum=function(f){return L.reduce(function(a,o){return a+f(o)},0)};
  var tot=sum(function(o){return o.tot}),dn=sum(function(o){return o.dn});
  var nx=act.filter(function(o){return o.calLeft>=0})[0];
  var kp=function(v,l,st){return '<div class="kpi"><b'+(st?' style="'+st+'"':'')+'><bdi>'+v+'</bdi></b><span>'+l+'</span></div>'};
  var h='<div class="kpis">'+
    kp(L.length,'كل العملاء')+kp(act.length,'شغال عليهم دلوقتي')+
    kp(act.filter(function(o){return o.k=='g'}).length,'ماشيين تمام')+
    kp(act.filter(function(o){return o.k=='w'||o.k=='r'}).length,'متأخرين')+
    kp(L.length-act.length,'اتسلموا')+
    kp(dn+' / '+tot,'المهام اللي خلصت')+
    kp((tot?Math.round(dn*100/tot):0)+'%','النسبة الكلية')+
    kp(sum(function(o){return o.dl?0:o.lateT}),'مهام متأخرة')+
    kp(nx?esc(nx.c.store):'—','أقرب تسليم'+(nx?' · '+(nx.calLeft?'بعد '+nx.calLeft+' يوم':'النهاردة'):''),'font-size:18px')+
  '</div>';
  h+='<div class="card"><strong>نظرة على كل العملاء</strong><div class="tw"><table class="st"><thead><tr><th>العميل</th><th>المتجر</th><th>التسليم</th><th>فاضل</th><th>المهام</th><th>النسبة</th><th>الحالة</th></tr></thead><tbody>'+
    L.map(function(o){return '<tr><td><b>'+esc(o.c.name)+'</b></td><td>'+esc(o.c.store)+'</td><td>'+fmt(o.delivery)+'</td><td>'+remTxt(o)+'</td><td><bdi>'+o.dn+'/'+o.tot+'</bdi></td><td><b><bdi>'+o.pct+'%</bdi></b></td><td><span class="tag '+kl(o.k)+'">'+o.s+'</span></td></tr>'}).join('')+
  '</tbody></table></div></div>';
  h+='<div class="grid">'+L.map(function(o){
    var c=o.c;
    return '<div class="card"><div class="hd"><div>'+title(c)+'</div><span class="tag '+kl(o.k)+'">'+o.s+'</span></div>'+
      '<div class="mu">'+o.m+'</div>'+
      '<div class="pr"><span class="mu">اللي خلص · '+o.dn+' من '+o.tot+' مهمة</span><b class="pct"><bdi>'+o.pct+'%</bdi></b></div><div class="bar g"><i style="width:'+o.pct+'%"></i></div>'+
      '<div class="pr"><span class="mu">الوقت اللي عدى · يوم '+Math.min(Math.max(o.cur,0),c.days)+' من '+c.days+'</span><b><bdi>'+o.timePct+'%</bdi></b></div><div class="bar t"><i style="width:'+o.timePct+'%"></i></div>'+
      '<div class="kv">'+
        '<div><b><bdi>'+o.open+'</bdi></b><span>مهام فاضلة</span></div>'+
        '<div><b><bdi>'+o.lateT+'</bdi></b><span>متأخرة</span></div>'+
        '<div><b><bdi>'+o.todayT+'</bdi></b><span>مطلوبة النهاردة</span></div>'+
        '<div><b><bdi>'+o.ahead+'</bdi></b><span>خلصتها من أيام جاية</span></div>'+
        '<div><b>'+fmt(o.start)+'</b><span>بدأ امتى</span></div>'+
        '<div><b>'+fmt(o.delivery)+'</b><span>ميعاد التسليم</span></div>'+
        '<div><b>'+remTxt(o)+'</b><span>فاضل على التسليم</span></div>'+
        '<div><b>'+esc(c.svc)+'</b><span>الخدمة</span></div>'+
      '</div>'+(o.f?'<div class="mu">'+o.f+'</div>':'')+
      '<div class="mu" style="margin-top:8px">الأيام (اللي خلص / الكل):</div>'+dayStrip(c,o.cur)+'</div>';
  }).join('')+'</div>';
  return h;
}
function render(){
  document.getElementById('tt').className=S.tab=='today'?'on':'';
  document.getElementById('tc').className=S.tab=='clients'?'on':'';
  document.getElementById('ts').className=S.tab=='stats'?'on':'';
  var banner=S.msg?'<div class="card hd"><span>'+esc(S.msg)+'</span><button class="b" onclick="S.msg=\'\';render()">×</button></div>':'';
  document.getElementById('app').innerHTML=banner+(S.tab=='today'?renderToday():S.tab=='stats'?renderStats():renderClients());
  if(S.focus){var e=document.getElementById(S.focus);if(e)e.focus();S.focus=null}
}

// ---------- تسجيل الدخول ----------
function perr(m){document.getElementById('pe').textContent=m}
async function login(){
  var em=document.getElementById('em').value.trim(),pw=document.getElementById('pw').value;
  if(!em||!pw){perr('اكتب الإيميل وكلمة المرور');return}
  var r=await sb.auth.signInWithPassword({email:em,password:pw});
  if(r.error){perr('بيانات الدخول غير صحيحة');return}
  perr('');document.getElementById('pw').value='';start();
}
function lockUI(){S.clients=[];S.msg='';S.ok=false;unsubscribe();document.body.classList.add('locked')}
async function logout(){
  try{await sb.auth.signOut({scope:'local'})}catch(e){}
  lockUI();
}
// ---------- المزامنة اللحظية بين الأجهزة ----------
var ch=null,_lt=null;
function scheduleLoad(){
  clearTimeout(_lt);
  _lt=setTimeout(function(){
    var a=document.activeElement;
    // لو بتكتب في خانة، استنى لحد ما تخلص عشان الشاشة ما تتمسحش
    if(a&&a.closest&&a.closest('#app')&&(a.tagName=='INPUT'&&a.type!='checkbox'||a.tagName=='SELECT')&&a.value){scheduleLoad();return}
    load();
  },500);
}
function subscribe(){
  if(ch)return;
  ch=sb.channel('planner-sync')
    .on('postgres_changes',{event:'*',schema:'public',table:'planner_clients'},scheduleLoad)
    .on('postgres_changes',{event:'*',schema:'public',table:'planner_tasks'},scheduleLoad)
    .subscribe();
}
function unsubscribe(){if(ch){sb.removeChannel(ch);ch=null}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.ok)scheduleLoad()});
window.addEventListener('online',function(){if(S.ok)scheduleLoad()});
// نقل مرة واحدة للبيانات القديمة اللي كانت متخزنة على الجهاز، وبعدين تتمسح
async function migrateLocal(){
  try{
    var d=JSON.parse(localStorage.getItem('doneOn')||'{}'),a=JSON.parse(localStorage.getItem('aheadTo')||'{}'),l=JSON.parse(localStorage.getItem('delLocal')||'{}'),jobs=[];
    Object.keys(d).forEach(function(id){jobs.push(sb.from('planner_tasks').update({completed_on:d[id]}).eq('id',id).is('completed_on',null))});
    Object.keys(a).forEach(function(id){jobs.push(sb.from('planner_clients').update({ahead_to:a[id]}).eq('id',id).is('ahead_to',null))});
    Object.keys(l).forEach(function(id){jobs.push(sb.from('planner_clients').update({delivered_at:l[id]}).eq('id',id).is('delivered_at',null))});
    var rs=await Promise.all(jobs);
    if(!rs.some(function(r){return r.error})){['doneOn','aheadTo','delLocal','cacheV1'].forEach(function(k){localStorage.removeItem(k)})}
    return jobs.length;
  }catch(e){return 0}
}
function start(){
  document.body.classList.remove('locked');
  subscribe();
  load().then(function(){return S.ok?migrateLocal():0}).then(function(n){if(n)load()});
}
sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT')lockUI()});
(async function(){
  document.getElementById('lg2').src=document.querySelector('.logo').src;
  if(document.body.classList.contains('locked'))return;
  start();
  var r=await sb.auth.getSession();
  if(r.data&&!r.data.session&&!r.error)lockUI();
})();
</script>
