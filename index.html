<style>
:root{--bg1:#0a0405;--bg2:#3d0b12;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.1);--tx:#f6eef0;--mut:#b9a6aa;--ac:#e0364b;--ok:#3fcf8e;--warn:#f2b84b;--bad:#ff5d6c;color-scheme:dark}
*{box-sizing:border-box}html{height:100%;background:#0a0405}body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 0% 0%,#0a0405,#3d0b12,#0a0405);pointer-events:none}
body{margin:0;min-height:100%;font-family:Tajawal,system-ui,sans-serif;color:var(--tx);padding:calc(76px + env(safe-area-inset-top,0px)) 0 env(safe-area-inset-bottom,0)}
header{position:fixed;top:0;left:0;right:0;width:100%;z-index:20;height:calc(76px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,0px) 24px 0;border-radius:0;border-bottom:1px solid var(--line);background:radial-gradient(circle at 50% 0%,rgba(224,54,75,.22),transparent 60%),rgba(10,4,5,.82);backdrop-filter:blur(14px)}
#out{margin-inline-start:auto}
header img{position:absolute;left:50%;top:calc(50% + env(safe-area-inset-top,0px)/2);transform:translate(-50%,-50%);height:50px;max-width:46%;object-fit:contain}
.hb{height:44px;min-width:44px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;justify-content:center}
.hb:hover{background:rgba(255,255,255,.12)}
main{width:100%;max-width:none;margin:0;padding:20px 24px 60px}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:10px;margin-bottom:20px}
nav button{flex:none;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);font:inherit;cursor:pointer}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-bottom:16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(6,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}

  if(k==="status"){const s=status(r);return s?`<span class="tag ${s[0]==="✅"?"t-ok":s[0]==="⚠"?"t-warn":"t-bad"}">${s}</span>`:""}
  if(k==="fee")return t==="support"?money(r.feeSnapshot??r.fee,r.currencySnapshot||r.currency):fmt(r.feeSnapshot??r.fee);if(t==="support"&&k==="paid")return money(collectedAmount(r),r.currency)+(r.renewalReview?" ⚠":"");if(t==="support"&&k==="currency")return esc(currencyLabel(r.currency));if(t==="support"&&k==="pstatus"){const v=paymentStatusSummary(r),cls=v.startsWith("مدفوع بالكامل")?"t-ok":v.startsWith("مدفوع جزئيًا")?"t-warn":"t-bad";return `<span class="tag ${cls}">${esc(v)}</span>`}if(k==="sstatus"){const st=subStatus(r);return st[0]?`<span class="tag ${st[1]}">${st[0]}</span>`:"—"}if(k==="end"&&t==="support"){const e2=endOf(r);return esc(r.end)||(e2?fd(e2):"—")}

  if(k==="stopMonths"){const n2=inaMonths(r);return n2?`<span class="tag t-warn">${n2} شهر</span>`:"0"}

  return esc(r[k]);
}

 const tbl=t=>{const ks=cols(t);return`<h2>${esc(nm(t))} (${S[t].length})</h2><div class="wrap"><table><tr>${ks.map(k=>`<th>${esc(lab(t,k))}</th>`).join("")}</tr>${S[t].map(r=>`<tr>${ks.map(k=>`<td>${esc(val(t,k,r))}</td>`).join("")}</tr>`).join("")}</table></div>`};
 const cards=[["إجمالي الدخل (ج.م)",fmt(a.e.all)],["المواقع المنفذة",S.clients.length],["مشاريع إضافية",S.projects.length],["اشتراكات الدعم",S.support.length],["المحصل من الدعم (ج.م)",fmt(a.sup)]];
 const h=`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(S.settings.title)} — نسخة ${ds}</title><style>body{margin:0;padding:24px;font-family:Tajawal,system-ui,sans-serif;background:#0a0405;color:#f6eef0}h1{font-size:20px}h2{font-size:17px;margin:28px 0 10px}.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.c{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px}.c b{display:block;font-size:22px;margin-top:4px}.k{color:#b9a6aa;font-size:13px}.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th{color:#b9a6aa;text-align:start;padding:8px;border-bottom:1px solid rgba(255,255,255,.15)}td{padding:8px;border-bottom:1px solid rgba(255,255,255,.06)}</style></head><body><h1>${esc(S.settings.title)} — نسخة بتاريخ ${ds}</h1><div class="g">${cards.map(([k,v])=>`<div class="c"><span class="k">${k}</span><b>${v}</b></div>`).join("")}</div>${tbl("clients")}${tbl("projects")}${tbl("support")}</body></html>`;
 dl("index.html",new Blob([h],{type:"text/html"}));
}
function fd(v){if(v instanceof Date)return v.getDate()+"/"+(v.getMonth()+1)+"/"+v.getFullYear();return v==null||v==="-"?"":String(v)}
function importFile(f){
  const rd=new FileReader();
  if(/\.json$/i.test(f.name)){rd.onload=()=>{try{S={...SEED,...JSON.parse(rd.result)};fixS();save();render();alert("تم الاستيراد ✅")}catch(e){alert("ملف البيانات غير صالح")}};rd.readAsText(f);return}
  rd.onload=()=>{try{const w=XLSX.read(rd.result,{type:"array",cellDates:true});
    const LEG={clients:"Clients",projects:"Projects",support:"Support"};
    Object.entries(SC).forEach(([t,c])=>{const ws=w.Sheets[c.sheet]||w.Sheets[LEG[t]];if(!ws)return;
      const all=XLSX.utils.sheet_to_json(ws,{defval:"",blankrows:true}),rg=XLSX.utils.decode_range(ws["!ref"]),hd={};
      for(let cc=rg.s.c;cc<=rg.e.c;cc++){const h=ws[XLSX.utils.encode_cell({r:0,c:cc})];if(h)hd[h.v]=cc}
      const lk=(ri,l)=>{const x=ws[XLSX.utils.encode_cell({r:ri+1,c:hd[l]})];return x&&x.l&&x.l.Target?x.l.Target:""};
      const rows=all.map((r,i)=>[r,i]).filter(([r])=>r[c.f[0][1]]);
      if(!rows.length&&t==="support")return;
      S[t]=rows.map(([r,i])=>Object.fromEntries(c.f.map(([k,l,ty])=>[k,ty==="n"?num(r[l]):ty==="u"?(lk(i,l)||(/^https?:/i.test(r[l])?r[l]:"")):fd(r[l])])))});
    fixS();save();render();alert("تم الاستيراد ✅")}catch(e){alert("تعذر قراءة الملف")}};
  rd.readAsArrayBuffer(f);
}
/* ---------- الأحداث ---------- */
const $=s=>document.querySelector(s),$logo=$("#logo"),DEF_LOGO=$logo.src,$nav=$("#nav"),$view=$("#view"),$dlg=$("#dlg"),$frm=$("#frm"),$file=$("#file");
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.dataset.rp){const n=new Date(),iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),k=t.dataset.rp;if(k==="all"){rf="";rt=""}else{rt=iso(n);rf=k==="m"?iso(new Date(n.getFullYear(),n.getMonth(),1)):k==="3"?iso(new Date(n.getFullYear(),n.getMonth()-2,1)):iso(new Date(n.getFullYear(),0,1))}render()}
  else if(t.dataset.t){tab=t.dataset.t;q="";render()}
  else if(t.dataset.add)openForm(t.dataset.add);
  else if(t.dataset.prof){const[a,b]=t.dataset.prof.split(":");a==="clients"?openClientProfile(+b):openProfile(+b)}
  else if(t.dataset.renewConfirm){const[a,b]=t.dataset.renewConfirm.split(":");confirmRenewal(+a,+b)}
  else if(t.dataset.renew)openRenew(+t.dataset.renew);
  else if(t.dataset.stop)toggleStop(+t.dataset.stop);
  else if(t.dataset.resume){toggleStop(+t.dataset.resume,true)}
  else if(t.dataset.addplan)openPlanForm();
  else if(t.dataset.plan)openPlanForm(+t.dataset.plan);
  else if(t.dataset.dplan){const j=+t.dataset.dplan;if(confirm("حذف الباقة دي؟")){S.settings.plans.splice(j,1);save();render()}}
  else if(t.dataset.edit){const[a,b]=t.dataset.edit.split(":");openForm(a,+b)}
  else if(t.dataset.del){const[a,b]=t.dataset.del.split(":");if(confirm("حذف السجل ده؟")){S[a].splice(+b,1);save();render()}}
  else if(t.dataset.m){const m=t.dataset.m;
    if(m==="xl")exportXlsx();else if(m==="html")exportHtml();else if(m==="js")dl("Work System.json",new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));
    else if(m==="im")$file.click();else if(m==="logo")$("#logof").click();else if(m==="logo0"){S.settings.logo="";save();theme()}else if(m==="cl"){if(confirm("هيتم مسح كل العملاء والمشاريع والاشتراكات. متأكد؟")){S.clients=[];S.projects=[];S.support=[];save();render()}}
    else if(m==="rs"&&confirm("هيتم مسح بياناتك الحالية والرجوع للبيانات الأصلية. متأكد؟")){S=JSON.parse(JSON.stringify(SEED));save();render()}}
});
$file.onchange=()=>{if($file.files[0])importFile($file.files[0]);$file.value=""};
document.addEventListener("input",e=>{
  if(e.target.id==="q"){q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)}
  else if(e.target.dataset.set){S.settings[e.target.dataset.set]=e.target.type==="number"?num(e.target.value):e.target.value;save();theme()}
  else if(e.target.dataset.list){S.settings.lists[e.target.dataset.list]=e.target.value.split("\n").map(x=>x.trim()).filter(Boolean);save()}
  else if(e.target.dataset.name){S.settings.names[e.target.dataset.name]=e.target.value.trim();save();renderNav()}
  else if(e.target.dataset.pre){S.settings.pre[e.target.dataset.pre]=e.target.value;save()}
});
document.addEventListener("change",e=>{if(!e.target.dataset.rng)return;if(e.target.dataset.rng==="f")rf=e.target.value;else rt=e.target.value;render()});
$("#logof").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,600/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.settings.logo=c.toDataURL("image/png");save();theme()};im.src=URL.createObjectURL(f);e.target.value=""};
/* ---------- بوابة تسجيل الدخول — Supabase Auth (إيميل + كلمة مرور لكل مستخدم) ---------- */
const $gate=$("#gate"),$gem=$("#gem"),$gpw=$("#gpw"),$gerr=$("#gerr"),$out=$("#out");
$("#glogo").src=DEF_LOGO;
function gateFail(msg){
  $gerr.textContent=msg;
  const gc=$gate.querySelector(".gcard");gc.classList.remove("shake");void gc.offsetWidth;gc.classList.add("shake");
}
function unlock(email){
  try{localStorage.setItem("wk_last",JSON.stringify({id:cloudUid,email}))}catch(e){}
  $gate.classList.add("off");document.body.classList.remove("locked");
  setTimeout(()=>$gate.remove(),450);
  if($out){$out.hidden=false;$out.title="تسجيل الخروج ("+email+")"}
  init();
}
async function tryUnlock(){
  if(!sb){gateFail("تعذر تسجيل الدخول الآن — تأكد من الاتصال بالإنترنت ثم أعد المحاولة");return}
  const em=$gem.value.trim(),pw=$gpw.value;
  if(!em||!pw){gateFail("ادخل البريد الإلكتروني وكلمة المرور");return}
  const $btn=$("#gform .btn");$btn.disabled=true;$gerr.textContent="جارٍ التحقق…";
  try{
    const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
    if(error){
      gateFail(error.message==="Invalid login credentials"?"بيانات الدخول غير صحيحة — تأكد من الإيميل وكلمة المرور":error.message==="Email not confirmed"?"البريد غير مؤكد — فعّل الحساب من Supabase → Authentication → Users":"تعذر تسجيل الدخول: "+error.message);
      $gpw.value="";
      return;
    }
    cloudUid=(data.user&&data.user.id)||null;cloudEmail=(data.user&&data.user.email)||em;unlock(cloudEmail);
  }catch(e){gateFail("تعذر الوصول إلى Supabase — تحقق من الاتصال وصحة SUPABASE_URL")}
  finally{$btn.disabled=false}
}
$("#gform").onsubmit=e=>{e.preventDefault();tryUnlock()};
if($out)$out.onclick=async()=>{try{localStorage.removeItem("wk_last")}catch(e){}try{if(sb)await sb.auth.signOut({scope:"local"})}catch(e){}location.reload()};
/* عند الفتح: جلسة محفوظة؟ فتح تلقائي — وإلا بطاقة الدخول */
(async()=>{
  const cached=()=>{try{const lu=JSON.parse(localStorage.getItem("wk_last")||"null");if(lu&&lu.id){cloudUid=lu.id;cloudEmail=lu.email||"";unlock(cloudEmail);return true}}catch(e){}return false};
  if(sb){
    try{
      const{data,error}=await sb.auth.getSession();
      if(data&&data.session&&data.session.user){cloudUid=data.session.user.id;cloudEmail=(data.session.user&&data.session.user.email)||"";unlock(cloudEmail);return}
      if(error&&cached())return;
    }catch(e){if(cached())return;$gerr.textContent="تعذر الوصول إلى Supabase — تحقق من الاتصال وصحة SUPABASE_URL"}
  }
  $gate.classList.add("need");$gpw.focus();
})();

</script>
